# 极弈 Application Properties
# Chinese Chess Assistant Application Configuration

# Application Information
app.name=极弈
app.version=1.0.0
app.description=Chinese Chess Assistant with AI Engine Support

# Logging Configuration
# Note: Detailed logging is configured in logback.xml
logging.level.root=INFO
logging.level.com.jiyi=DEBUG

# JavaFX Configuration
javafx.preloader.enabled=false

# File Encoding
file.encoding=UTF-8

# Default Engine Configuration
engine.default.threads=4
engine.default.hash=128

# Detection Configuration
detection.confidence.threshold=0.7
detection.interval.ms=1000

# UI Configuration
ui.theme=default
ui.language=zh_CN

# Performance
performance.max.threads=8
